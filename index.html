<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDITOR DOGO - Bio Links</title>
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f7f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 15px;
            object-fit: cover;
            display: block;
            border: 2px solid #000;
        }

        .profile h2 {
            font-size: 24px;
            font-weight: 800;
            color: #000;
            margin-bottom: 8px;
        }

        .tagline {
            font-weight: 700;
            font-size: 15px;
            color: #111;
            margin-bottom: 25px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            border-radius: 12px;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn i {
            font-size: 18px;
        }

        .telegram { background: linear-gradient(90deg, #2AABEE, #229ED9); }
        .tiktok { background: linear-gradient(90deg, #25F4EE, #FE2C55); }
        .facebook { background: #1877F2; }
        .youtube { background: #FF0000; }
        .instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 22px;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .social-icons a {
            color: #000;
            text-decoration: none;
        }

        .featured-banner {
            background-color: #8ce62c;
            padding: 16px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
            font-size: 17px;
            color: #000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-decoration: none;
            margin-bottom: 25px;
        }

        .footer-credit {
            font-size: 13px;
            color: #666;
            margin-top: 10px;
            font-weight: 500;
        }

        .footer-credit a {
            color: #229ED9;
            text-decoration: none;
            font-weight: 700;
        }

        .footer-credit a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Section -->
        <div class="profile">
            <!-- 👇 ঠিক নিচের "YOUR_IMAGE_URL_HERE" মুছে আপনার ইমেজের ডাইরেক্ট লিংক বসিয়ে দিন 👇 -->
            <img src="https://github.com/toufiqur69/Editor-Dogo/blob/main/IMG_5947.jpeg?raw=true" alt="Logo" class="avatar">
            
            <h2>EDITOR DOGO</h2>
            <p class="tagline">Technology • Digital Awareness</p>
        </div>

        <!-- Links Section -->
        <div class="links">
            <a href="https://t.me/editordogo" class="btn telegram">
                <i class="fab fa-telegram-plane"></i> My Telegram
            </a>
            <a href="https://tiktok.com/@itz_toufiqur" class="btn tiktok">
                <i class="fab fa-tiktok"></i> My TikTok
            </a>
            <a href="https://www.facebook.com/share/1DLALzvEGT/?mibextid=wwXIfr" class="btn facebook">
                <i class="fab fa-facebook-f"></i> My Facebook
            </a>
            <a href="https://instagram.com/editordogo" class="btn instagram">
                <i class="fab fa-instagram"></i> My Instagram
            </a>
            <a href="https://youtube.com/@editordogo?si=2mgMtspZGvzjVp6B" class="btn youtube">
                <i class="fab fa-youtube"></i> My YouTube
            </a>
        </div>

        <!-- Social Icons Section -->
        <div class="social-icons">
            <a href="mailto:editordogo@gmail.com"><i class="far fa-envelope"></i></a>
            <a href="https://tiktok.com/@itz_toufiqur"><i class="fab fa-tiktok"></i></a>
            <a href="https://t.me/editordogo"><i class="fab fa-telegram-plane"></i></a>
        </div>

        <!-- Featured Banner -->
        <a href="https://editordogo.com" class="featured-banner">
            <span>Premium App Store</span>
            <i class="fas fa-share-alt"></i>
        </a>

        <!-- Developer Credit Footer -->
        <div class="footer-credit">
            Developed by <a href="https://t.me/ernyok" target="_blank">Toufiqur</a>
        </div>
    </div>

</body>
</html>
