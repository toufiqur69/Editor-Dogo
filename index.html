<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Links</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Profile Section -->
        <div class="profile">
            <img src="profile.png" alt="Profile Picture" class="avatar">
            <h2>spdadnan</h2>
            <p class="tagline">Technology • Digital Awareness</p>
        </div>

        <!-- Links Section -->
        <div class="links">
            <a href="#" class="btn telegram">
                <i class="fab fa-telegram-plane"></i> My Telegram
            </a>
            <a href="#" class="btn tiktok">
                <i class="fab fa-tiktok"></i> My TikTok
            </a>
            <a href="#" class="btn facebook">
                <i class="fab fa-facebook-f"></i> My Facebook
            </a>
            <a href="#" class="btn youtube">
                <i class="fab fa-youtube"></i> My YouTube
            </a>
            <a href="#" class="btn instagram">
                <i class="fab fa-instagram"></i> My Instagram
            </a>
        </div>

        <!-- Social Icons Section -->
        <div class="social-icons">
            <a href="#"><i class="far fa-envelope"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
            <a href="#"><i class="fab fa-telegram"></i></a>
        </div>

        <!-- Featured Banner -->
        <div class="featured-banner">
            <span>Premium App Store</span>
            <i class="fas fa-share-alt"></i>
        </div>
    </div>
</body>
</html>
